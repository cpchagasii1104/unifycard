# O gate C.22 passou a correr no workflow unificado `system-gates.yml`.
# Mantido para execução manual ou referências históricas (evita duplicar jobs em PR).
name: canonical-gates

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install (monorepo)
        run: pnpm install --frozen-lockfile

      - name: Gate C.22 (canonical SQL patterns)
        run: pnpm --filter unificard-backend run check:canonical-gates
